<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fab Creations — Coming Soon</title>
  <meta name="description" content="Fab-Creations.com has been successfully registered and is coming soon.">
  <style>
    :root {
      --gold: #f4bd4f;
      --gold-light: #ffd978;
      --black: #050505;
      --muted: #a9a9a9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #fff;
      background:
        radial-gradient(circle at 50% 35%, rgba(244, 189, 79, .12), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(244, 189, 79, .07), transparent 35%),
        var(--black);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 18px;
      border: 1px solid rgba(244, 189, 79, .18);
      border-radius: 28px;
      pointer-events: none;
    }

    .card {
      width: min(760px, 100%);
      padding: 42px 28px 38px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: clamp(150px, 28vw, 220px);
      height: auto;
      display: block;
      margin: 0 auto 30px;
      border-radius: 50%;
      filter: drop-shadow(0 12px 35px rgba(244, 189, 79, .12));
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      border: 1px solid rgba(244, 189, 79, .35);
      border-radius: 999px;
      background: rgba(244, 189, 79, .06);
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
    }

    h1 {
      font-size: clamp(42px, 8vw, 78px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 800;
      margin-bottom: 20px;
    }

    h1 span {
      color: var(--gold);
    }

    .domain {
      font-size: clamp(17px, 3vw, 23px);
      font-weight: 600;
      color: #f2f2f2;
      margin-bottom: 17px;
      letter-spacing: -.02em;
    }

    .domain strong {
      color: var(--gold-light);
    }

    .message {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .line {
      width: 76px;
      height: 2px;
      margin: 30px auto 24px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .footer {
      color: #6f6f6f;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      body { padding: 18px; }
      body::before { inset: 10px; border-radius: 20px; }
      .card { padding: 28px 14px; }
      .logo { margin-bottom: 24px; }
      .message { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Fab Creations Logo" class="logo">

    <div class="status">
      <span class="dot"></span>
      Domain Registered Successfully
    </div>

    <h1>
      Something <span>Beautiful</span><br>
      is Coming.
    </h1>

    <p class="domain">
      <strong>Fab-Creations.com</strong> is coming soon.
    </p>

    <p class="message">
      We’ve successfully secured our domain and are now preparing something
      special. Our new website is currently under development.
      <br>
      Please check back soon.
    </p>

    <div class="line"></div>

    <p class="footer">
      Fab Creations &nbsp;•&nbsp; Coming Soon
    </p>
  </main>
</body>
</html>
